name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

jobs:
  debug-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Compile
        run: |
          ./gradlew assembleDebug

      - name: Sign Apk
        continue-on-error: true
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/debug
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK artifact
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug-signed.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug-signed.apk Yougram.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Yougram.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} Yougram.apk \;
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: Yougram.apk

  release-nightly:
    if: github.ref_name == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: debug-builds
    steps:
      - uses: actions/checkout@v6

      - name: Download Debug APK
        uses: actions/download-artifact@v6
        with:
          name: app
          path: .

      - name: Get Date and Time
        run: |
          echo "TIME=$(date -u +'%T')" >> $GITHUB_ENV
          echo "DATE=$(date -u +'%d-%m-%Y')" >> $GITHUB_ENV

      - name: Create Nightly Tag
        run: git tag -f nightly && git push -f origin nightly

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: nightly
          makeLatest: true
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: false
          artifacts: Yougram.apk
          name: Yougram Nightly ${{ env.DATE }}
          body: |
            ### 🚀 Yougram Nightly Release (${{ env.DATE }} ${{ env.TIME }})
            
            Welcome to **Yougram** — The open-source, ad-free YouTube Android client with Telegram-inspired aesthetics.

            #### ✨ Highlights & Features:
            - 🚫 **100% Ad-Free**: Blocks video pre-roll, mid-roll, and home banner ads.
            - ⏭️ **SponsorBlock**: Auto-skips sponsor segments, creator intros, and outros.
            - 🎧 **Background Play & PiP**: Listen with screen off or watch in mini floating player.
            - 📥 **Built-in Downloader**: Directly save high quality Video & MP3 Audio.
            - 🎨 **Telegram Blue + OLED Pitch Black**: Sleek modern UI design.
            - 👎 **Return YouTube Dislike**: Dislike numbers restored.
            - 🔒 **Privacy Focused**: No Google account or Play Services required.
